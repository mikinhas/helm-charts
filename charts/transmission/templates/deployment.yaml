{{- /* Volume holding /config: the user's mount if there is one, else an emptyDir added by the chart */ -}}
{{- $configVolume := include "transmission.configVolumeName" . }}
{{- $configEmptyDir := and .Values.config.enabled (eq $configVolume "") }}
{{- if $configEmptyDir }}
{{- $configVolume = "config" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transmission.fullname" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "transmission.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.config.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.config.enabled }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "transmission.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "transmission.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.config.enabled }}
      {{- /* Copies settings.json from the ConfigMap into /config on every start, so the
           image can still apply USER/PASS/PEERPORT/WHITELIST on top of it with jq. */}}
      initContainers:
        - name: settings
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cp", "/settings/settings.json", "/config/settings.json"]
          volumeMounts:
            - name: settings
              mountPath: /settings
              readOnly: true
            - name: {{ $configVolume }}
              mountPath: /config
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range .Values.podEnvVars }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: transmission
              containerPort: 9091
              protocol: TCP
            - name: 51413-tcp
              containerPort: 51413
              protocol: TCP
            - name: 51413-udp
              containerPort: 51413
              protocol: UDP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts $configEmptyDir }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $configEmptyDir }}
            - name: {{ $configVolume }}
              mountPath: /config
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.config.enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.config.enabled }}
        - name: settings
          configMap:
            name: {{ include "transmission.fullname" . }}-settings
        {{- end }}
        {{- if $configEmptyDir }}
        - name: {{ $configVolume }}
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
